<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Nama — Asep Saepullah | Full Stack Developer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ========================================
       Business Card — Styles
       ======================================== */

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dark Theme */
    :root, [data-theme="dark"] {
      --bg-primary: #06060b;
      --bg-secondary: #0e0e16;
      --surface: #12121c;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #0ea5e9;
      --accent-light: #38bdf8;
      --accent-dark: #0284c7;
      --accent-rgb: 14, 165, 233;
      --accent2: #06b6d4;
      --accent2-rgb: 6, 182, 212;
      --border: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.12);
      --glass-bg: rgba(14, 14, 22, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --card-bg: rgba(255, 255, 255, 0.025);
      --card-hover-bg: rgba(255, 255, 255, 0.055);
    }

    /* Light Theme */
    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #f1f5f9;
      --surface: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #0284c7;
      --accent-light: #0ea5e9;
      --accent-dark: #0369a1;
      --accent-rgb: 2, 132, 199;
      --accent2: #0891b2;
      --accent2-rgb: 8, 145, 178;
      --border: rgba(0, 0, 0, 0.07);
      --border-strong: rgba(0, 0, 0, 0.12);
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.5);
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-hover-bg: rgba(255, 255, 255, 0.9);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 2rem 1rem;
      position: relative;
    }

    /* ---- Animated Background ---- */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-mesh__orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.4;
      animation: orbFloat 20s infinite ease-in-out;
    }

    .bg-mesh__orb:nth-child(1) {
      width: 500px;
      height: 500px;
      background: rgba(var(--accent-rgb), 0.12);
      top: -15%;
      left: -10%;
      animation-delay: 0s;
    }

    .bg-mesh__orb:nth-child(2) {
      width: 400px;
      height: 400px;
      background: rgba(var(--accent2-rgb), 0.08);
      bottom: -20%;
      right: -10%;
      animation-delay: -7s;
    }

    .bg-mesh__orb:nth-child(3) {
      width: 300px;
      height: 300px;
      background: rgba(99, 102, 241, 0.06);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -14s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -40px) scale(1.05); }
      50% { transform: translate(-20px, 20px) scale(0.95); }
      75% { transform: translate(15px, 35px) scale(1.02); }
    }

    /* ---- Grid pattern background ---- */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: 
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.5;
    }

    /* ---- Main Wrapper ---- */
    .card-page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      max-width: 480px;
      width: 100%;
    }

    /* ---- Page Header ---- */
    .page-header {
      text-align: center;
      animation: fadeInUp 0.8s var(--ease) both;
    }

    .page-header__brand {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent);
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    .page-header__title {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .page-header__title span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ---- Business Card Container ---- */
    .card-scene {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1.75 / 1;
      perspective: 1200px;
      cursor: pointer;
      animation: fadeInUp 0.8s 0.2s var(--ease) both;
    }

    .card-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.8s var(--ease);
      transform-style: preserve-3d;
    }

    .card-scene.flipped .card-3d {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 1.25rem;
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }

    .card-face--front {
      background: linear-gradient(145deg, var(--surface), var(--bg-secondary));
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.3),
        0 0 0 1px var(--glass-border),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .card-face--back {
      background: linear-gradient(145deg, var(--bg-secondary), var(--surface));
      transform: rotateY(180deg);
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.3),
        0 0 0 1px var(--glass-border),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    /* ---- Card Front ---- */
    .card-front {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 1.8rem 2rem;
      position: relative;
    }

    .card-front__accent {
      position: absolute;
      top: 0;
      right: 0;
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.15), rgba(var(--accent2-rgb), 0.08));
      border-radius: 0 1.25rem 0 100%;
      pointer-events: none;
    }

    .card-front__accent::after {
      content: '';
      position: absolute;
      top: 15px;
      right: 15px;
      width: 80px;
      height: 80px;
      border: 2px solid rgba(var(--accent-rgb), 0.15);
      border-radius: 0 1rem 0 50%;
    }

    .card-front__top {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      position: relative;
      z-index: 1;
    }

    .card-front__avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(var(--accent-rgb), 0.3);
      box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.15);
      flex-shrink: 0;
    }

    .card-front__identity {
      flex: 1;
      min-width: 0;
    }

    .card-front__name {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.2rem;
    }

    .card-front__title {
      font-size: 0.78rem;
      color: var(--accent-light);
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .card-front__bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      z-index: 1;
    }

    .card-front__contacts {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .card-front__contact-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      color: var(--text-secondary);
    }

    .card-front__contact-item svg {
      width: 13px;
      height: 13px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .card-front__brand {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 700;
      opacity: 0.4;
    }

    .card-front__brand span {
      color: var(--accent);
    }

    /* ---- Card Back ---- */
    .card-back {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 2rem;
      position: relative;
      text-align: center;
      gap: 1rem;
    }

    .card-back__pattern {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image: 
        repeating-linear-gradient(45deg, var(--accent) 0, var(--accent) 1px, transparent 0, transparent 50%),
        repeating-linear-gradient(-45deg, var(--accent) 0, var(--accent) 1px, transparent 0, transparent 50%);
      background-size: 20px 20px;
      pointer-events: none;
    }

    .card-back__qr {
      width: 120px;
      height: 120px;
      background: #fff;
      border-radius: 0.75rem;
      padding: 8px;
      position: relative;
      z-index: 1;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .card-back__qr canvas {
      width: 100% !important;
      height: 100% !important;
      border-radius: 0.4rem;
    }

    .card-back__label {
      font-size: 0.75rem;
      color: var(--text-muted);
      position: relative;
      z-index: 1;
    }

    .card-back__brand {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .card-back__brand span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card-back__tagline {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    /* ---- Flip Hint ---- */
    .flip-hint {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      animation: fadeInUp 0.8s 0.4s var(--ease) both;
    }

    .flip-hint__icon {
      width: 20px;
      height: 20px;
      animation: flipHintPulse 2s infinite var(--ease);
    }

    @keyframes flipHintPulse {
      0%, 100% { transform: rotateY(0); }
      50% { transform: rotateY(180deg); }
    }

    /* ---- Action Buttons ---- */
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      animation: fadeInUp 0.8s 0.5s var(--ease) both;
      width: 100%;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.4rem;
      border: none;
      border-radius: 0.75rem;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 300ms var(--ease);
      position: relative;
      overflow: hidden;
    }

    .card-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .card-btn--primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 15px rgba(var(--accent-rgb), 0.3);
    }

    .card-btn--primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(var(--accent-rgb), 0.4);
    }

    .card-btn--outline {
      background: var(--card-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      backdrop-filter: blur(10px);
    }

    .card-btn--outline:hover {
      background: var(--card-hover-bg);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .card-btn--whatsapp {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
    }

    .card-btn--whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
    }

    /* ---- Social Links ---- */
    .card-socials {
      display: flex;
      gap: 0.75rem;
      animation: fadeInUp 0.8s 0.6s var(--ease) both;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 300ms var(--ease);
      backdrop-filter: blur(10px);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
    }

    .social-btn:hover {
      transform: translateY(-3px) scale(1.05);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 8px 20px rgba(var(--accent-rgb), 0.2);
    }

    .social-btn--facebook:hover { border-color: #1877F2; color: #1877F2; box-shadow: 0 8px 20px rgba(24, 119, 242, 0.2); }
    .social-btn--instagram:hover { border-color: #E4405F; color: #E4405F; box-shadow: 0 8px 20px rgba(228, 64, 95, 0.2); }
    .social-btn--threads:hover { border-color: var(--text-primary); color: var(--text-primary); }
    .social-btn--telegram:hover { border-color: #26A5E4; color: #26A5E4; box-shadow: 0 8px 20px rgba(38, 165, 228, 0.2); }
    .social-btn--whatsapp:hover { border-color: #22c55e; color: #22c55e; box-shadow: 0 8px 20px rgba(34, 197, 94, 0.2); }

    /* ---- Theme Toggle ---- */
    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 300ms var(--ease);
    }

    .theme-toggle:hover {
      transform: rotate(20deg) scale(1.1);
      border-color: var(--accent);
    }

    /* ---- Back Link ---- */
    .back-link {
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      transition: all 300ms var(--ease);
    }

    .back-link:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .back-link svg {
      width: 14px;
      height: 14px;
    }

    /* ---- Toast ---- */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface);
      color: var(--text-primary);
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      border: 1px solid var(--border-strong);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      z-index: 200;
      transition: transform 400ms var(--ease);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* ---- Animations ---- */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Card tilt on hover */
    .card-scene:not(.flipped) .card-3d {
      transition: transform 0.3s var(--ease);
    }

    .card-scene.flipped .card-3d {
      transition: transform 0.8s var(--ease);
    }

    /* ---- Print Styles ---- */
    @media print {
      body {
        background: white;
        padding: 0;
      }
      .bg-mesh, .bg-grid, .theme-toggle, .back-link, 
      .card-actions, .card-socials, .flip-hint, .toast {
        display: none !important;
      }
      .card-scene {
        box-shadow: 0 0 0 1px #ccc;
      }
    }

    /* ---- Responsive ---- */
    @media (max-width: 480px) {
      body {
        padding: 1.5rem 1rem;
      }

      .page-header__title {
        font-size: 1.3rem;
      }

      .card-scene {
        max-width: 100%;
      }

      .card-front {
        padding: 1.4rem 1.5rem;
      }

      .card-front__avatar {
        width: 46px;
        height: 46px;
      }

      .card-front__name {
        font-size: 1rem;
      }

      .card-front__title {
        font-size: 0.7rem;
      }

      .card-front__contact-item {
        font-size: 0.65rem;
      }

      .card-actions {
        flex-direction: column;
      }

      .card-btn {
        justify-content: center;
        width: 100%;
      }

      .back-link span {
        display: none;
      }
    }
  </style>
</head>

  <script>
    /* ========================================
       Business Card — Logic
       ======================================== */

    // --- vCard Data ---
    const VCARD = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'FN:Asep Saepullah',
      'N:Saepullah;Asep;;;',
      'TITLE:Full Stack Developer',
      'TEL;TYPE=CELL:+6287808880393',
      'EMAIL:asepsaidung@gmail.com',
      'URL:https://saepullrock.tech',
      'NOTE:Full Stack Developer — Laravel\\, Filament\\, PHP\\, JavaScript. Portfolio: saepullrock.tech',
      'END:VCARD'
    ].join('\n');

    // --- QR Code Generation ---
    function generateQR() {
      const canvas = document.getElementById('qr-canvas');
      if (canvas && typeof QRCode !== 'undefined') {
        QRCode.toCanvas(canvas, VCARD, {
          width: 200,
          margin: 0,
          color: {
            dark: '#0e0e16',
            light: '#ffffff'
          },
          errorCorrectionLevel: 'M'
        });
      }
    }

    // --- Card Flip ---
    const cardScene = document.getElementById('card-scene');
    cardScene.addEventListener('click', () => {
      cardScene.classList.toggle('flipped');
    });

    // --- Card Tilt Effect (mouse only) ---
    cardScene.addEventListener('mousemove', (e) => {
      if (cardScene.classList.contains('flipped')) return;
      const rect = cardScene.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -8;
      const rotateY = ((x - centerX) / centerX) * 8;
      
      cardScene.querySelector('.card-3d').style.transform = 
        `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    cardScene.addEventListener('mouseleave', () => {
      if (cardScene.classList.contains('flipped')) return;
      cardScene.querySelector('.card-3d').style.transform = '';
    });

    // --- Save Contact (vCard Download) ---
    document.getElementById('btn-save-contact').addEventListener('click', () => {
      const blob = new Blob([VCARD], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Asep_Saepullah.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('✅ Kontak berhasil diunduh!');
    });

    // --- Share ---
    document.getElementById('btn-share').addEventListener('click', async () => {
      const shareData = {
        title: 'Asep Saepullah — Full Stack Developer',
        text: 'Kartu nama digital Asep Saepullah — Full Stack Developer. Laravel, Filament, PHP, JavaScript.',
        url: 'https://saepullrock.tech/kartu-nama.html'
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await navigator.clipboard.writeText(shareData.url);
          showToast('🔗 Link berhasil disalin!');
        }
      } catch (err) {
        // User cancelled or error
        if (err.name !== 'AbortError') {
          try {
            await navigator.clipboard.writeText(shareData.url);
            showToast('🔗 Link berhasil disalin!');
          } catch {
            showToast('❌ Gagal membagikan');
          }
        }
      }
    });

    // --- Toast ---
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // --- Theme Toggle ---
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const html = document.documentElement;

    // Sync with main page theme
    const savedTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    themeIcon.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

    themeToggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      themeIcon.textContent = next === 'dark' ? '🌙' : '☀️';
      
      // Re-generate QR with matching colors
      generateQR();
    });

    // --- Init ---
    window.addEventListener('DOMContentLoaded', () => {
      generateQR();
    });
  </script>
